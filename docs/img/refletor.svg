<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111">
  <title>Refletor em V para as placas, visto de cima</title>
  <rect width="920" height="450" fill="#fff"/>
  <text x="24" y="34" font-size="20">Refletor em V (dobra de 90°), visto de cima</text>
  <text x="24" y="58" fill="#555">Papelão com papel-alumínio liso. Cada lado com uns 25 cm de largura e 20 cm de altura.</text>

  <!-- Placa A com o V -->
  <g transform="translate(70,230)">
    <path d="M0,0 L110,-110 M0,0 L110,110" stroke="#111" stroke-width="5" fill="none"/>
    <rect x="18" y="-12" width="70" height="24" fill="#fff" stroke="#111" stroke-width="2"/>
    <rect x="72" y="-12" width="16" height="24" fill="#111"/>
    <text x="40" y="5" font-size="13">A</text>
    <path d="M0,-26 L88,-26" stroke="#555" stroke-width="1.5" marker-start="url(#s)" marker-end="url(#s)"/>
    <text x="96" y="-30" fill="#555">≈ 6 cm</text>
    <text x="-40" y="-120" fill="#555">dobra</text>
    <path d="M-12,-112 L-2,-8" stroke="#555" stroke-width="1"/>
  </g>

  <!-- Placa B com o V espelhado -->
  <g transform="translate(850,230) scale(-1,1)">
    <path d="M0,0 L110,-110 M0,0 L110,110" stroke="#111" stroke-width="5" fill="none"/>
    <rect x="18" y="-12" width="70" height="24" fill="#fff" stroke="#111" stroke-width="2"/>
    <rect x="72" y="-12" width="16" height="24" fill="#111"/>
  </g>
  <text x="790" y="235" font-size="13">B</text>

  <!-- Caminho entre as placas -->
  <path d="M178,230 L742,230" stroke="#111" stroke-width="1.5" stroke-dasharray="6 6"/>
  <ellipse cx="460" cy="230" rx="282" ry="38" fill="none" stroke="#999" stroke-width="1.5"/>
  <text x="400" y="186" fill="#555">zona sensível (≈ 22 cm de raio no meio)</text>
  <text x="430" y="292">1 a 2 m</text>

  <!-- Legendas -->
  <rect x="24" y="352" width="14" height="14" fill="#111"/>
  <text x="46" y="364">antena (o zigue-zague dourado na ponta da placa), virada para a outra placa</text>
  <path d="M24,392 L38,392" stroke="#111" stroke-width="5"/>
  <text x="46" y="397">alumínio a pelo menos 2 cm da antena e sem encostar nos pinos (curto-circuito)</text>
  <text x="24" y="430" fill="#555">≈ 6 cm: da dobra do V até a antena. É um ponto de partida: mudem um pouco e fiquem com a posição que der mais pacotes na tela.</text>

  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M5,0 L5,10" stroke="#555" stroke-width="2"/></marker>
  </defs>
</svg>
